<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
</head>

<body>

  <div class="app" id="app">

    <div class="particles" id="particles"></div>

    <form class="weatherForm">
      <span class="searchIcon">⌕</span>
      <input type="text" class="cityInput" placeholder="Search city" autocomplete="off">
    </form>

    <div class="card" style="display: none;"></div>

    <div class="hint">Try "Velbert" or any city</div>

  </div>

  <script src="index.js"></script>
</body>

</html>
