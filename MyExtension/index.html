<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Nest</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-card">
    <header class="header">
      <h1>Link Nest</h1>
    </header>

    <div class="input-wrap">
      <input type="text" id="input-el" placeholder="Paste a link...">
    </div>

    <div class="button-row">
      <button type="button" id="input-btn">Save</button>
      <button type="button" id="tab-btn" class="secondary">Save tab</button>
      <button type="button" id="delete-btn" class="danger">Delete</button>
      <button type="button" id="theme-btn" class="ghost">Dark</button>
    </div>

    <ul id="ul-el" class="link-list"></ul>
  </div>

  <script src="index.js"></script>
</body>

</html>
