<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Password Generator</h2>

      <div class="input-group">
        <input
          type="text"
          id="passwordDisplay"
          readonly
          placeholder="Generating Password..."
        />
        <button class="copy-btn" id="copyBtn">Copy</button>
      </div>

      <button id="generateBtn">Generate Password</button>

      <div class="options">
        <div class="option">
          <label for="lengthInput">Length:</label>
          <input
            type="number"
            id="lengthInput"
            value="16"
            min="8"
            max="64"
            style="width: 60px; padding: 4px"
          />
        </div>
        <div class="option">
          <input type="checkbox" id="chkLower" checked /><label for="chkLower"
            >Lowercase (a-z)</label
          >
        </div>
        <div class="option">
          <input type="checkbox" id="chkUpper" checked /><label for="chkUpper"
            >Uppercase (A-Z)</label
          >
        </div>
        <div class="option">
          <input type="checkbox" id="chkNumbers" checked /><label
            for="chkNumbers"
            >Number (0-9)</label
          >
        </div>
        <div class="option">
          <input type="checkbox" id="chkSymbols" checked /><label
            for="chkSymbols"
            >Symbols (!@#...)</label
          >
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
