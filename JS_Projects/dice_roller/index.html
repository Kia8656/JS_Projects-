<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice Roller</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="input-data">
        <h1>Dice Roller</h1>
        <input
          type="number"
          id="dice-input"
          placeholder="How many dice?"
          value="1"
          min="1"
        />
        <button id="submit-btn">ROLL DICE</button>
      </div>
      <div id="num-of-dice"></div>
      <div id="dice-images"></div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
