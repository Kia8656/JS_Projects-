<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digitale Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="format-toggle" role="group" aria-label="Time format">
        <button type="button" data-format="12" aria-pressed="false">
          12-hour
        </button>
        <button type="button" data-format="24" aria-pressed="true">
          24-hour
        </button>
      </div>
      <div id="clock"></div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
